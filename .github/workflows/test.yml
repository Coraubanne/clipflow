name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: outputs/ytdlp/requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -r outputs/ytdlp/requirements-lock.txt
      - name: Run tests
        env:
          PYTHONPATH: outputs/ytdlp
        run: python -m unittest discover -s outputs/ytdlp/tests
